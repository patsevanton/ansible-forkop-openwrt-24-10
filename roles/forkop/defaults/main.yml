---
forkop_installer_url: https://raw.githubusercontent.com/ushan0v/forkop/main/install.sh

# Подписки задаются ответом на вопрос при запуске playbook:
# один и тот же список URL пишется и в main, и в russian.
forkop_subscriptions: []

# Community-списки задаются ответом на вопрос при запуске playbook.
forkop_community_lists: []

# Скачивать rule-set'ы community-списков напрямую, а не через прокси.
# С '1' sing-box получает rule_set.download_detour = main-out, где ещё не
# выбран живой узел (приоритетная группа стартует с мёртвого дефолта).
# Загрузка виснет, на 10-й секунде forkop убивает sing-box и уходит
# в бесконечный ретрай:
#   "sing-box did not reach a stable running state after start. Aborted."
forkop_download_lists_via_proxy: '0'

# Страны, в которых ни один узел подписки не отвечал стабильно.
# Снято на рабочем роутере 192.168.2.1 2026-10-24 по Clash API (/proxies):
# 33 среза за 33 минуты (07:42-08:14 UTC), узел считался живым, если отвечал
# хотя бы в одном срезе. Ни в одной из этих стран не нашлось узла, живого
# в 80% срезов: лучший результат — GT, 36%. Узлы из списка выкинуты из
# уровня "Основные" приоритетной группы, чтобы демон перебирал меньше
# неотвечающих серверов, прежде чем найти живой. При смене подписки список
# надо пересобрать.
forkop_priority_exclude_countries:
  - AW
  - BB
  - BM
  - BW
  - CG
  - CI
  - CN
  - CW
  - ER
  - FJ
  - GT
  - GU
  - IR
  - JE
  - JM
  - JO
  - KY
  - MH
  - ML
  - MV
  - PS
  - RW
  - SC
  - SR
  - SZ
  - TT
  - VA
  - VI

# RU-узлы, у которых в имени нет флага: flag_emoji определяет страну только по
# флагу, поэтому exclude_countries их не видит, и по протоколу hysteria2 они
# попадают в уровень "Основные (hy2)". Такие узлы отсекаются по имени.
# Список — регулярные выражения POSIX ERE, регистр важен: если в подписке
# появится другое написание, шаблон надо дополнить.
forkop_priority_exclude_regex:
  - '[Rr]ussian'
  - '[Rr]ussia'
  - 'Росси'
  - 'Русск'
  - 'РФ'

# Страны второго уровня приоритетной группы ("Ближние"): используются, когда
# все hysteria2-узлы легли. Отобраны по тем же 33 срезам: у каждой страны был
# хотя бы один узел, живой в 80% срезов, и медиана задержки ниже 400 мс.
forkop_priority_near_countries:
  - DE
  - EE
  - ES
  - FI
  - FR
  - IE
  - LV
  - NL
  # NO без кавычек YAML 1.1 читает как false.
  - 'NO'
  - PL
  - PT
  - SE

# Сколько ждать, пока поднимутся sing-box и DNS.
forkop_start_retries: 40
forkop_start_delay: 3
