---
forkop_installer_url: https://raw.githubusercontent.com/ushan0v/forkop/main/install.sh

# Подписки задаются ответом на вопрос при запуске playbook:
# один и тот же список URL пишется и в main, и в russian.
forkop_subscriptions: []

# Community-списки задаются ответом на вопрос при запуске playbook.
forkop_community_lists: []

# Сколько ждать, пока поднимутся sing-box и DNS.
forkop_start_retries: 40
forkop_start_delay: 3
