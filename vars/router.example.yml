# Шаблон: скопируй в vars/router.yml (он в .gitignore) и заполни.
#
#   cp vars/router.example.yml vars/router.yml
#   ansible-playbook playbooks/site.yml -e @vars/router.yml
#
# hostname, пароли, подписки и community-списки Forkop спрашиваются
# при запуске playbook.
#
# ВАЖНО: файл передаётся через -e, поэтому всё, что здесь указано, имеет
# высший приоритет и перебивает ответы на вопросы. Пустые значения не
# оставляй. Пароли здесь хранить не рекомендуется.

---
# --- подключение -----------------------------------------------------------
# IP роутера до запуска: свежая прошивка — 192.168.1.1,
# при повторном запуске — текущий адрес роутера.
ansible_host: 192.168.1.1

# Если на контроллере нет sshpass (Ansible < 2.19), раскомментируй:
# ansible_connection: paramiko

# --- необязательно: что иначе спрашивается при запуске ---------------------
# Если значение указано здесь, соответствующий вопрос не задаётся
# (файл передаётся через -e, и это перебивает vars_prompt).
# Пустым не оставляй — пустое значение тоже перебьёт вопрос.
#
# router_hostname: kosmos2
# router_password: "пароль Wi-Fi (оба диапазона) и новый пароль root"
# forkop_community_lists_input: "russia_inside,youtube,telegram,github,cloudflare"
#
# Подписки — списком, по одному URL на строку. Один и тот же список
# пишется в секции main и russian.
# forkop_subscriptions_input:
#   - "https://..."
#   - "https://..."

# Текущий пароль root вопроса не имеет: по умолчанию пусто (свежая прошивка).
# Если роутер уже настроен, раскомментируй и укажи пароль:
# ansible_password: "..."

# --- LAN -------------------------------------------------------------------
# LAN (адрес, маска, DHCP) настрой вручную в LuCI до запуска playbook.
# ansible_host выше должен совпадать с LAN-адресом роутера.

# --- WAN -------------------------------------------------------------------
# WAN (PPPoE: логин и пароль) настрой заранее в LuCI или через uci.
# Playbook его не трогает, но требует, чтобы WAN уже был поднят и был
# доступ в интернет.

# --- SQM -------------------------------------------------------------------
# sqm_interface по умолчанию определяется сам: pppoe-wan при PPPoE, wan при DHCP.
# При необходимости зафиксируй вручную:
# sqm_interface: pppoe-wan
sqm_enabled: true
sqm_download_kbit: 85000
sqm_upload_kbit: 10000
