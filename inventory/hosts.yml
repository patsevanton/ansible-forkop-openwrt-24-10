---
all:
  children:
    # новый роутер (после прошивки OpenWrt 24.10)
    openwrt:
      hosts:
        new_router:
          ansible_host: 192.168.1.1
          ansible_user: root
          # На свежей прошивке пароля нет. Если роутер уже настроен,
          # передай текущий пароль: -e ansible_password='...'
          ansible_password: ""
          ansible_connection: ssh
          ansible_shell_type: sh

    # существующий роутер, с которого снимаем конфиг (playbooks/dump.yml)
    reference:
      hosts:
        reference_router:
          ansible_host: 192.168.3.1
          ansible_user: root
          ansible_password: ""
          ansible_connection: ssh
          ansible_shell_type: sh
